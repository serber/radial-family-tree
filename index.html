<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Радиальное семейное дерево — GEDCOM</title>

      name="description"
      content="Бесплатный онлайн-визуализатор семейного дерева из GEDCOM-файла: радиальная (круговая) диаграмма потомков, гибкая настройка внешнего вида и экспорт в JPEG для печати постера. Файл обрабатывается прямо в браузере и никуда не отправляется."
    />
    <meta
      name="keywords"
      content="семейное дерево, генеалогическое древо, родословная, генеалогия, GEDCOM, визуализация GEDCOM, радиальная диаграмма, круговое дерево, постер семейного дерева, family tree, genealogy chart, GEDCOM viewer, radial family tree"
    />
    <meta name="robots" content="index, follow" />

    <link rel="alternate" hreflang="x-default" href="https://gedtree.ru/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GedTree" />
    <meta property="og:title" content="Радиальное семейное дерево — визуализация GEDCOM" />
    <meta
      property="og:description"
      content="Загрузите GEDCOM-файл и получите красивую круговую диаграмму семейного дерева с экспортом в JPEG для печати. Бесплатно, без регистрации, данные не покидают браузер."
    />
    <meta property="og:url" content="https://gedtree.ru/" />

    <meta name="twitter:card" content="summary_large_image" />

      name="twitter:description"
      content="Круговая диаграмма семейного дерева из GEDCOM-файла с экспортом в JPEG для печати постера."
    />
    <meta name="twitter:image" content="https://gedtree.ru/og-image.jpg" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Радиальное семейное дерево",
        "alternateName": "Radial Family Tree",
        "url": "https://gedtree.ru/",
        "description": "Онлайн-визуализатор генеалогического древа из GEDCOM-файла: радиальная диаграмма потомков с экспортом в JPEG для печати постера. Данные обрабатываются локально в браузере.",
        "image": "https://gedtree.ru/og-image.jpg",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "inLanguage": ["ru", "en"],
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "RUB" },
        "featureList": [
          "Загрузка GEDCOM-файлов (обработка полностью в браузере)",
          "Радиальная (круговая) диаграмма потомков",
          "Настройка геометрии, карточек и цветов",
          "Экспорт в JPEG в форматах печати A3–A0, Full HD и 4K"
        ]
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar sb">
        <header class="sidebar__header">
          <div class="sidebar__title-row">
            <h1 data-i18n="app.heading">Радиальное семейное дерево</h1>
            <div class="lang-switch" id="langSwitch">
              <button type="button" data-lang="en">EN</button>
              <button type="button" data-lang="ru">RU</button>
            </div>
          </div>
          <p data-i18n="app.subtitle">Визуализация GEDCOM</p>
          <div class="legend">
            <span><i class="legend__swatch legend__swatch--male"></i><span data-i18n="legend.male">Мужчины</span></span>
            <span><i class="legend__swatch legend__swatch--female"></i><span data-i18n="legend.female">Женщины</span></span>
          </div>
        </header>

        <div class="data-actions">
          <label class="btn btn--file"><span data-i18n="actions.load">Загрузить GEDCOM</span>
            <input type="file" id="fileInput" accept=".ged,.gedcom,.txt" />
          </label>
          <button class="btn" id="sampleBtn" type="button" data-i18n="actions.sample">Пример</button>
        </div>

        <div class="field">
          <div class="field__label" data-i18n="fields.rootFamily">Корневая семья</div>
          <div class="select-wrap">
            <select id="rootSelect" disabled></select>
          </div>
        </div>

        <div id="settingsPanel"></div>

        <div class="field">
          <div class="field__label" data-i18n="fields.canvasSize">Размер полотна</div>
          <div class="select-wrap">
            <select id="printSizeSelect"></select>
          </div>
          <button class="btn btn--primary" id="exportBtn" type="button" data-i18n="actions.export">Скачать JPEG</button>
        </div>
      </aside>

      <main class="stage">
        <div id="chart"></div>
        <footer class="stage__bar">
          <span id="status" role="status"></span>
          <button class="link-btn" id="fitBtn" type="button" data-i18n="actions.fit">Вписать в экран</button>
        </footer>
      </main>
    </div>
    <noscript>
      <p>
        Радиальное семейное дерево — бесплатный онлайн-визуализатор генеалогического древа из
        GEDCOM-файла. Загрузите файл из любой генеалогической программы (MyHeritage, Gramps, Family
        Tree Builder, Древо Жизни и др.) и получите круговую диаграмму потомков с экспортом в JPEG
        для печати постера. Для работы приложения необходимо включить JavaScript.
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
